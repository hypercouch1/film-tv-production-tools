# Builds the Mac and Windows apps on GitHub's machines.
# - "Run workflow" from the Actions tab: download the apps from the run's Artifacts section.
# - Pushing a version tag (e.g. v1.2.0): also publishes a GitHub Release with the installers
#   and RELEASE_NOTES.md. The app's update notice checks these releases.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      # Let the other platform finish even if one fails.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            name: mac-app
            files: |
              dist/*.dmg
              dist/*.zip
          - os: windows-latest
            args: --win
            name: windows-app
            files: dist/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Apple Developer certificate: build an unsigned (ad-hoc signed) app.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Production Tools ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: artifacts/*
          fail_on_unmatched_files: true
