# Builds the Mac and Windows apps on GitHub's machines.
# - "Run workflow" from the Actions tab: download the apps from the run's Artifacts section.
# - Pushing a version tag (e.g. v1.2.0): also publishes a GitHub Release with the installers
#   and RELEASE_NOTES.md. Installed apps update themselves from these releases.
name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Read-only by default; only the release job below gets write access.
permissions:
  contents: read

jobs:
  build:
    strategy:
      # Let the other platform finish even if one fails.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
            name: mac-app
            # latest-mac.yml / latest.yml tell installed apps about the update (and its checksum).
            files: |
              dist/*.dmg
              dist/*.zip
              dist/*.blockmap
              dist/latest-mac.yml
          - os: windows-latest
            args: --win
            name: windows-app
            files: |
              dist/*.exe
              dist/*.blockmap
              dist/latest.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # A release tag must match the app's version, or installed apps would think
      # they're out of date (the app reports package.json's version).
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version ${version}. Update \"version\" in package.json, commit, then tag that commit."
            exit 1
          fi
          # The release shows only this version's notes; make sure they're written.
          node scripts/release-notes.js "${GITHUB_REF_NAME}" > /dev/null || { echo "::error::Add a '# Production Tools ${version#v}' section to RELEASE_NOTES.md."; exit 1; }
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx electron-builder ${{ matrix.args }} --publish never
        env:
          # No Apple Developer certificate: build an unsigned (ad-hoc signed) app.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.files }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      # Only this version's section of RELEASE_NOTES.md: what's new and changed in this update.
      - name: Release notes for this version
        run: node scripts/release-notes.js "${GITHUB_REF_NAME}" > release-notes.md
      # Third-party action pinned to an exact commit (v2) so a moved tag can't change what runs.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          name: Production Tools ${{ github.ref_name }}
          body_path: release-notes.md
          files: artifacts/*
          fail_on_unmatched_files: true
