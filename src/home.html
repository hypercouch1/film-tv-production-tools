<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*">
  <title>Production Tools</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/bebas-neue/index.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="collab.css">
</head>
<body>
  <div class="home">
    <header class="home-header">
      <div class="title-row">
        <span class="live-dot"></span>
        <h1 class="sheet-title">Production Tools</h1>
        <div id="account"></div>
      </div>
      <p class="home-sub" id="homeSub">Choose a production, or start a new one.</p>
    </header>

    <section class="prod-grid" id="productions"></section>

    <section class="prod-shared" id="sharedSection" hidden>
      <h2 class="section-title">Shared with you</h2>
      <div class="prod-grid" id="shared"></div>
    </section>

    <section class="prod-shared" id="looseSection" hidden>
      <h2 class="section-title">Shared before productions</h2>
      <p class="muted small">Scripts and call sheets shared on their own. Move each into a production to work on it there.</p>
      <div class="loose-list" id="loose"></div>
    </section>

    <section class="upcoming" id="upcoming" hidden>
      <h2 class="section-title">Upcoming Shoots</h2>
      <ul class="upcoming-list" id="upcomingList"></ul>
    </section>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="sync-core.js"></script>
  <script src="cloud.js"></script>
  <script src="collab-ui.js"></script>
  <script src="shotsheet-formats.js"></script>
  <script src="production.js"></script>
  <script src="home.js"></script>
</body>
</html>
