<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https: wss: http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*">
  <title>Budget</title>
  <link rel="stylesheet" href="../node_modules/@fontsource/bebas-neue/index.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="shotsheet.css">
  <link rel="stylesheet" href="post.css">
  <link rel="stylesheet" href="budget.css">
  <link rel="stylesheet" href="collab.css">
</head>
<body>
  <div class="app sidebar-hidden" id="app">
    <main class="stage">
      <div class="toolbar">
        <button class="icon-btn" id="homeBtn" title="Home (Ctrl/Cmd+H)">⌂</button>
        <span class="system-label">Budget</span>
        <span class="undo-group">
          <button class="icon-btn" id="undoBtn" title="Undo (Ctrl/Cmd+Z)">↶</button>
          <button class="icon-btn" id="redoBtn" title="Redo (Ctrl+Y / Cmd+Shift+Z)">↷</button>
        </span>
        <div class="seg" id="viewToggle">
          <button data-view="top">Top sheet</button>
          <button data-view="detail">Detail</button>
          <button data-view="costs">Costs</button>
          <button data-view="report">Cost report</button>
        </div>
        <div class="toolbar-spacer"></div>
        <div class="menu-wrap">
          <button class="ghost-btn" data-menu="exportMenu">Export ▾</button>
          <div class="menu" id="exportMenu" hidden>
            <button data-export="csv">Budget as CSV (.csv)</button>
            <button data-export="costs">Expenses as CSV (.csv)</button>
            <button data-export="pdf">This view as PDF (.pdf)</button>
          </div>
        </div>
      </div>

      <div class="sheet" id="sheet">
        <header class="sheet-header">
          <div class="title-row">
            <span class="live-dot cyan"></span>
            <h1 class="sheet-title" id="title"></h1>
          </div>
        </header>
        <div class="sections" id="sections"></div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="sync-core.js"></script>
  <script src="cloud.js"></script>
  <script src="collab-ui.js"></script>
  <script src="history.js"></script>
  <script src="script-parse.js"></script>
  <script src="screenplay.js"></script>
  <script src="shotsheet-formats.js"></script>
  <script src="production.js"></script>
  <script src="schedule-views.js"></script>
  <script src="breakdown-views.js"></script>
  <script src="budget-formats.js"></script>
  <script src="gear-formats.js"></script>
  <script src="search.js"></script>
  <script src="budget.js"></script>
</body>
</html>
